<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/Polylingo-/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PolyLingo — Universal AI Translation Platform for Texts, Documents, PDFs, Images, and Live OCR.">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PolyLingo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PolyLingo — Universal AI Translation Platform</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0B0F19;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
      z-index: 9999;
    }
    .logo-box {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .spinner-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(0, 180, 216, 0.15);
      border-top: 3px solid #00B4D8;
      border-right: 3px solid #7209B7;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    .logo-icon {
      font-size: 36px;
      user-select: none;
      filter: drop-shadow(0 0 16px rgba(0, 180, 216, 0.6));
    }
    .app-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #00B4D8 0%, #90E0EF 50%, #7209B7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .loading-status {
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-box">
      <div class="spinner-ring"></div>
      <div class="logo-icon">🌐</div>
    </div>
    <div class="app-title">PolyLingo</div>
    <div class="loading-status" id="loading-text">Initializing AI Translation Engine...</div>
  </div>

  <script>
    window.addEventListener('load', function() {
      // Remove loading indicator once flutter is fully rendered
      var checkFlutter = setInterval(function() {
        var flutterView = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
        if (flutterView) {
          clearInterval(checkFlutter);
          var loader = document.getElementById('loading-container');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(function() {
              loader.remove();
            }, 400);
          }
        }
      }, 100);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
